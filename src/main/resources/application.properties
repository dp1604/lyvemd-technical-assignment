spring.application.name=atlas
spring.main.banner-mode=off
spring.main.log-startup-info=false
server.address=127.0.0.1
server.port=${ATLAS_HTTP_PORT:18081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
server.tomcat.connection-timeout=5s
server.tomcat.max-http-form-post-size=2MB
server.max-http-request-header-size=8KB
server.tomcat.accesslog.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
spring.mvc.log-request-details=false
spring.servlet.multipart.enabled=false
spring.datasource.url=${ATLAS_DB_URL}
spring.datasource.username=${ATLAS_DB_USER}
spring.datasource.password=${ATLAS_DB_PASSWORD}
spring.datasource.hikari.schema=atlas
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jdbc.template.query-timeout=10
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.root=WARN
logging.level.org.springframework.jdbc=OFF
logging.level.com.zaxxer.hikari=OFF
logging.level.ca.uhn.fhir=OFF
logging.level.org.hl7.fhir=OFF
logging.level.org.springframework.transaction.support.TransactionTemplate=OFF
